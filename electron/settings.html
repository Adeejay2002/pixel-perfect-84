<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Receipt printer settings</title>
<style>
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #1e1e1e;
    color: #eee;
    padding: 20px;
  }
  h1 { font-size: 15px; margin: 0 0 14px; }
  label { display: block; font-size: 12px; color: #aaa; margin: 14px 0 6px; }
  select, button {
    width: 100%;
    padding: 8px;
    border-radius: 6px;
    border: 1px solid #444;
    background: #2a2a2a;
    color: #eee;
    font-size: 13px;
  }
  button {
    margin-top: 20px;
    background: #22c55e;
    color: #000;
    font-weight: 600;
    border: none;
    cursor: pointer;
  }
  button:hover { background: #16a34a; }
  button.secondary { background: #2a2a2a; color: #eee; border: 1px solid #444; margin-top: 10px; }
  button.secondary:hover { background: #333; }
  button:disabled { opacity: 0.5; cursor: default; }
  #status { font-size: 11px; color: #22c55e; margin-top: 10px; min-height: 14px; }
  #status.error { color: #f87171; }
  .hint { font-size: 11px; color: #777; margin-top: 4px; }
</style>
</head>
<body>
  <h1>Receipt printer (XP-80T etc.)</h1>

  <label for="printer">Windows printer</label>
  <select id="printer"></select>
  <p class="hint">Install the XP-80T driver first so it shows up here as a normal Windows printer.</p>

  <label for="width">Paper width</label>
  <select id="width">
    <option value="80">80mm (XP-80T)</option>
    <option value="58">58mm</option>
  </select>

  <label for="mode">Print mode</label>
  <select id="mode">
    <option value="escpos">ESC/POS image (recommended for Xprinter)</option>
    <option value="text">ESC/POS text (English only, fastest)</option>
    <option value="driver">Windows driver</option>
  </select>
  <p class="hint">If receipts print as garbage characters, use ESC/POS image or text. If one fails, the other is tried automatically.</p>

  <button id="save">Save</button>
  <button id="test" class="secondary">Test print</button>
  <div id="status"></div>

  <script>
    async function init() {
      const printers = await window.settingsAPI.listPrinters();
      const cfg = await window.settingsAPI.getConfig();

      const printerSel = document.getElementById("printer");
      const defaultOpt = document.createElement("option");
      defaultOpt.value = "";
      defaultOpt.textContent = "System default printer";
      printerSel.appendChild(defaultOpt);

      for (const p of printers) {
        const opt = document.createElement("option");
        opt.value = p.name;
        opt.textContent = p.displayName || p.name;
        printerSel.appendChild(opt);
      }
      printerSel.value = cfg.deviceName || "";
      document.getElementById("width").value = String(cfg.paperWidthMm || 80);
      document.getElementById("mode").value = cfg.printMode || "escpos";
    }

    function formValues() {
      return {
        deviceName: document.getElementById("printer").value,
        paperWidthMm: Number(document.getElementById("width").value),
        printMode: document.getElementById("mode").value,
      };
    }
    function showStatus(text, isError) {
      const status = document.getElementById("status");
      status.textContent = text;
      status.className = isError ? "error" : "";
    }

    document.getElementById("save").addEventListener("click", async () => {
      await window.settingsAPI.setConfig(formValues());
      showStatus("Saved.", false);
      setTimeout(() => showStatus("", false), 2000);
    });

    document.getElementById("test").addEventListener("click", async () => {
      const btn = document.getElementById("test");
      btn.disabled = true;
      showStatus("Printing test receipt…", false);
      try {
        const r = await window.settingsAPI.testPrint(formValues());
        if (r && r.ok) showStatus("Test receipt sent to the printer.", false);
        else showStatus("Print failed: " + ((r && r.error) || "unknown error"), true);
      } catch (e) {
        showStatus("Print failed: " + e.message, true);
      } finally {
        btn.disabled = false;
      }
    });

    init();
  </script>
</body>
</html>
