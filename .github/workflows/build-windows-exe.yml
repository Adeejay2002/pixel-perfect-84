name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    # needed to create the GitHub Release
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build web app (vite + nitro node-server)
        run: npm run build
        env:
          NITRO_PRESET: node-server

      - name: Package Windows installer (.exe)
        run: npx electron-builder --win --publish=never

      # Shows in the build log exactly what was produced
      - name: List build output
        shell: pwsh
        run: Get-ChildItem dist | Select-Object Name, Length

      # 1) Artifact: appears under "Artifacts" at the bottom of the run page
      #    (click to download a .zip that contains the installer).
      - name: Upload installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: jnex-pos-windows
          path: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 30

      # 2) Draft release: Repository -> Releases (drafts are only visible to
      #    people with write access). latest.yml + .blockmap are what the
      #    in-app updater needs, so they are uploaded too.
      - name: Upload EXE to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-build-${{ github.run_number }}
          name: "Development Build #${{ github.run_number }}"
          files: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
          draft: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
