name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    
    # Release එකක් create කරන්න අවශ්‍ය permissions
    permissions:
      contents: write 

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build web app (vite + nitro node-server)
        run: npm run build
        env:
          NITRO_PRESET: node-server

      - name: Package Windows installer (.exe)
        run: npx electron-builder --win --publish=never

      # Artifact එකක් විදිහට නැතුව Release එකක් විදිහට upload කිරීම
      - name: Upload EXE to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-build-${{ github.run_number }}
          name: "Development Build #${{ github.run_number }}"
          files: dist/*.exe
          draft: true # Draft එකක් විදිහට සේව් වෙන නිසා පස්සේ ලේසියෙන්ම download කරගන්න පුළුවන්
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
